# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set API_TOKEN=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# KHÔNG khai báo startCommand ở đây.
#
# startCommand của Railway ghi đè CMD trong Dockerfile và được chạy KHÔNG qua
# shell, nên "$PORT" bị truyền nguyên văn cho uvicorn:
#     Error: Invalid value for '--port': '$PORT' is not a valid integer.
#
# Dockerfile đã xử lý đúng bằng cách bọc trong `sh -c` để shell nội suy biến:
#     CMD ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"]
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
